
name: Build Aseprite

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable Long Paths
        shell: powershell
        run: git config --system core.longpaths true

      - name: Install Build Tools
        shell: powershell
        run: choco install cmake ninja innosetup -y --no-progress

      - name: Initialize MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download Aseprite Source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $version = "v1.3.18.6"
          $url = "https://github.com/aseprite/aseprite/releases/download/$version/Aseprite-$version-Source.zip"

          Invoke-WebRequest -Uri $url -OutFile aseprite.zip

          Expand-Archive -Path aseprite.zip -DestinationPath source_temp -Force

          $root = Get-ChildItem source_temp -Filter CMakeLists.txt -Recurse |
            Select-Object -First 1

          if (-not $root) {
            throw "Aseprite source not found."
          }

          New-Item -ItemType Directory -Force -Path aseprite | Out-Null

          Get-ChildItem $root.Directory.FullName |
            Move-Item -Destination aseprite -Force

          "ASE_VER=$version" >> $env:GITHUB_ENV

      - name: Download Precompiled Skia
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip"

          Invoke-WebRequest -Uri $url -OutFile skia.zip

          if ((Get-Item skia.zip).Length -lt 100000) {
            throw "Skia download is too small."
          }

          Expand-Archive -Path skia.zip -DestinationPath skia_temp -Force

          $library = Get-ChildItem skia_temp -Filter skia.lib -Recurse |
            Select-Object -First 1

          if (-not $library) {
            throw "skia.lib not found."
          }

          $skiaRoot = $library.Directory.Parent.Parent.FullName

          if (-not (Test-Path "$skiaRoot\include\core\SkCanvas.h")) {
            throw "Skia headers not found."
          }

          "SKIA_ROOT=$skiaRoot" >> $env:GITHUB_ENV

          Write-Host "Skia installed at $skiaRoot"

      - name: Configure CMake
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          cmake -G Ninja `
            -S "$env:GITHUB_WORKSPACE\aseprite" `
            -B "$env:GITHUB_WORKSPACE\build" `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DLAF_BACKEND=skia `
            -DSKIA_DIR="$env:SKIA_ROOT" `
            -DSKIA_LIBRARY_DIR="$env:SKIA_ROOT\out\Release-x64" `
            -DSKIA_LIBRARY="$env:SKIA_ROOT\out\Release-x64\skia.lib" `
            -DENABLE_UPDATER=OFF `
            -DENABLE_TESTS=OFF

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed."
          }

      - name: Compile Aseprite
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $cpuCount = (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors
          $jobs = [math]::Min($cpuCount, 4)

          ninja -C build -j $jobs aseprite

          if ($LASTEXITCODE -ne 0) {
            throw "Compilation failed."
          }

      - name: Verify Executable
        shell: powershell
        run: |
          if (-not (Test-Path "build\bin\aseprite.exe")) {
            throw "Aseprite executable not found."
          }

          Write-Host "Aseprite built successfully!"

      - name: Package Installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $binPath = "$env:GITHUB_WORKSPACE\build\bin"

          $iss = @"
          [Setup]
          AppName=Aseprite
          AppVersion=${{ env.ASE_VER }}
          DefaultDirName={autopf}\Aseprite
          DefaultGroupName=Aseprite
          OutputBaseFilename=aseprite-setup
          OutputDir=installer
          Compression=lzma
          SolidCompression=yes

          [Files]
          Source: "$binPath\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Aseprite"; Filename: "{app}\aseprite.exe"
          "@

          New-Item -ItemType Directory -Force -Path installer | Out-Null

          $iss | Out-File aseprite.iss -Encoding utf8

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" aseprite.iss

          if ($LASTEXITCODE -ne 0) {
            throw "Installer packaging failed."
          }

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-Installer
          path: installer/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ env.ASE_VER }}
          name: Aseprite ${{ env.ASE_VER }}
          files: installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
