Run $ErrorActionPreference = "Stop"
  $ErrorActionPreference = "Stop"
  
  # Download the Skia repository instead of the GitHub homepage.
  $skiaUrl = "https://github.com/aseprite/skia/archive/refs/heads/main.zip"
  
  Invoke-WebRequest `
    -Uri $skiaUrl `
    -OutFile "skia.zip" `
    -UseBasicParsing
  
  # Verify the downloaded file is a real ZIP.
  $file = Get-Item "skia.zip"
  
  if ($file.Length -lt 100000) {
    throw "Skia download is too small. The URL may not point to a ZIP archive."
  }
  
  try {
    Add-Type -AssemblyName System.IO.Compression.FileSystem
    $zip = [System.IO.Compression.ZipFile]::OpenRead(
      (Resolve-Path "skia.zip").Path
    )
    $zip.Dispose()
  }
  catch {
    throw "Skia download is not a valid ZIP archive: $_"
  }
  
  Expand-Archive -Path "skia.zip" -DestinationPath "skia_temp" -Force
  
  $skiaRoot = Get-ChildItem "skia_temp" -Directory |
    Select-Object -First 1
  
  if (-not $skiaRoot) {
    throw "Skia extraction failed."
  }
  
  if (Test-Path "skia") {
    Remove-Item "skia" -Recurse -Force
  }
  
  Move-Item $skiaRoot.FullName "skia"
  
  if (-not (Test-Path "skia\include\core\SkCanvas.h")) {
    throw "Downloaded Skia source does not contain the expected headers."
  }
  
  Write-Host "Skia source downloaded and extracted successfully."
  shell: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.EXE -command ". '{0}'"
  env:
    DOWNLOAD_URL: https://github.com/aseprite/aseprite/releases/download/v1.3.18.6/Aseprite-v1.3.18.6-Source.zip
    ASE_VER: v1.3.18.6
  
